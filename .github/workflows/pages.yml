name: Publish Drops POS Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site to gh-pages
        run: |
          mkdir -p /tmp/site
          cp index.html manifest.webmanifest sw.js icon.svg /tmp/site/
          touch /tmp/site/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-publish
          git rm -rf .
          cp -r /tmp/site/. .
          git add -A
          git commit -m "Publish Drops POS"
          git push --force origin HEAD:gh-pages
