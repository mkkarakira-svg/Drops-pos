name: Build Drops POS

on:
  push:
    branches: [ develop-pos-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build clean APK
        run: gradle clean assembleDebug
      - name: Create unique APK name
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="DropsPOS-v${VERSION_NAME}-b${VERSION_CODE}-run${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
      - name: Upload unique APK
        uses: actions/upload-artifact@v4
        with:
          name: DropsPOS-${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.version_code }}-run${{ github.run_number }}
          path: ${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
