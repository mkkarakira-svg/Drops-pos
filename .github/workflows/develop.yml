name: Build Drops POS V3.2 FINAL
on:
  push:
    branches: [ develop-pos-v1 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DropsPOS-V3.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DropsPOS-V3.2-FINAL
          path: DropsPOS-V3.2.apk
