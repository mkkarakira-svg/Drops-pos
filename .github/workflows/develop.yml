name: Build Drops POS

on:
  push:
    branches: [ develop-pos-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Keep the same debug signing key between GitHub Actions builds.
      # Without this, Android rejects updates with "App not installed"
      # because each fresh runner can create a different signing certificate.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: drops-pos-stable-debug-signing-v1

      - name: Ensure debug signing key exists
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Drops POS,C=LB"
          fi

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle clean assembleDebug

      - name: Verify APK is signed and installable
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -n 5

      - name: Create uniquely named APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "DropsPOS-v${{ steps.version.outputs.name }}-b${{ steps.version.outputs.code }}-run${{ github.run_number }}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DropsPOS-v${{ steps.version.outputs.name }}-b${{ steps.version.outputs.code }}-run${{ github.run_number }}-${{ github.sha }}
          path: DropsPOS-v${{ steps.version.outputs.name }}-b${{ steps.version.outputs.code }}-run${{ github.run_number }}-*.apk
          if-no-files-found: error
