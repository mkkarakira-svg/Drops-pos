name: Build test APK (no deployment)
on:
  push:
    branches:
      - fix/backup-native-priority-20261016
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned test APK
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon
      - name: Inspect APK size and contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          unzip -l "$APK" | tail -n 25
          test "$(stat -c%s "$APK")" -gt 10000
      - uses: actions/upload-artifact@v4
        with:
          name: drops-pos-test-apk-DO-NOT-INSTALL-ON-LIVE-DATA
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
