name: Diagnose Drops POS Signing
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key safely
        env:
          DROPS_KEYSTORE_BASE64: ${{ secrets.DROPS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DROPS_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/drops-release.jks
          test -s app/drops-release.jks
          echo "Keystore decoded: $(wc -c < app/drops-release.jks) bytes"

      - name: Verify keystore before build
        env:
          DROPS_KEYSTORE_PASSWORD: ${{ secrets.DROPS_KEYSTORE_PASSWORD }}
          DROPS_KEY_ALIAS: ${{ secrets.DROPS_KEY_ALIAS }}
        run: |
          keytool -list -keystore app/drops-release.jks -storepass "$DROPS_KEYSTORE_PASSWORD" >/dev/null
          keytool -list -keystore app/drops-release.jks -storepass "$DROPS_KEYSTORE_PASSWORD" -alias "$DROPS_KEY_ALIAS" >/dev/null
          echo "Keystore password and alias verified."

      - name: Build signed release APK
        env:
          DROPS_KEYSTORE_FILE: drops-release.jks
          DROPS_KEYSTORE_PASSWORD: ${{ secrets.DROPS_KEYSTORE_PASSWORD }}
          DROPS_KEY_ALIAS: ${{ secrets.DROPS_KEY_ALIAS }}
          DROPS_KEY_PASSWORD: ${{ secrets.DROPS_KEY_PASSWORD }}
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: DropsPOS-v4.2.1-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
