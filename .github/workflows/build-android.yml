name: Build Drops POS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare bundled offline web app
        run: |
          mkdir -p www
          cp index.html icon.svg manifest.webmanifest sw.js www/
      - name: Install Capacitor and generate Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Verify application identity and version
        run: |
          node -e "const c=require('./capacitor.config.json');const p=require('./package.json');if(c.appId!=='com.dropsdetergents.pos'||p.version!=='4.3.59')process.exit(1)"
      - name: Set Android version metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          import re
          s, n1 = re.subn(r"versionCode\s+\d+", "versionCode 4359", s, count=1)
          s, n2 = re.subn(r"versionName\s+['\"][^'\"]+['\"]", "versionName '4.3.59'", s, count=1)
          assert n1 == 1 and n2 == 1, "Missing Android version fields"
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Inspect generated APK identity and signing certificate
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$AAPT" dump badging "$APK" | grep '^package:'
          "$AAPT" dump badging "$APK" | grep -q "versionCode='4359' versionName='4.3.59'"
          ACTUAL=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          test "$ACTUAL" = "com.dropsdetergents.pos" || { echo "Unexpected APK application ID: $ACTUAL"; exit 1; }
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: DropsPOS-4.3.59-SIGNED-CANDIDATE-NOT-FOR-INSTALL
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
