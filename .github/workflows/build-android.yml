name: Build Drops POS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'price-lists.js'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare bundled offline web app
        run: |
          mkdir -p www
          cp index.html icon.svg manifest.webmanifest sw.js price-lists.js www/
      - name: Install Capacitor and generate Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Verify application identity and version
        run: |
          node -e "const c=require('./capacitor.config.json');const p=require('./package.json');if(c.appId!=='com.dropsdetergents.pos'||p.version!=='4.3.63')process.exit(1)"
      - name: Set Android version metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          import re
          s, n1 = re.subn(r"versionCode\s+\d+", "versionCode 4363", s, count=1)
          s, n2 = re.subn(r"versionName\s+['\"][^'\"]+['\"]", "versionName '4.3.63'", s, count=1)
          assert n1 == 1 and n2 == 1, "Missing Android version fields"
          p.write_text(s)
          PY
      - name: Restore permanent signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.DROPS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DROPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DROPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DROPS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || exit 1
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pos-drops.jks"
          test -s "$RUNNER_TEMP/pos-drops.jks"
          echo "POS_DROPS_KEYSTORE_PATH=$RUNNER_TEMP/pos-drops.jks" >> "$GITHUB_ENV"
      - name: Configure existing signing key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          p.write_text(p.read_text() + """
          android {
            signingConfigs {
              posDrops {
                storeFile file(System.getenv('POS_DROPS_KEYSTORE_PATH'))
                storePassword System.getenv('STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }
            buildTypes {
              debug {
                signingConfig signingConfigs.posDrops
              }
            }
          }
          """)
          PY
      - name: Build signed candidate APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.DROPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DROPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DROPS_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Inspect generated APK identity and signing certificate
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$AAPT" dump badging "$APK" | grep '^package:'
          "$APKSIGNER" verify --print-certs "$APK"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          test "$CERT" = '8ae50d6d01c2e2d9ae82d2a1f4b00ba697d199beae3fba2b7c2f222aa34f0b63' || { echo 'Signer mismatch'; exit 1; }
          "$AAPT" dump badging "$APK" | grep -q "versionCode='4363' versionName='4.3.63'"
          ACTUAL=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          test "$ACTUAL" = "com.dropsdetergents.pos" || { echo "Unexpected APK application ID: $ACTUAL"; exit 1; }
      - name: Guard separate installation identity
        run: |
          echo "This APK uses com.dropsdetergents.pos, distinct from installed com.dropsdetergents.posdrops.test"
          echo "Do not uninstall the existing app; this candidate installs separately."
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: POSDrops-4.3.63-SEPARATE-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish signed update v4.3.63
        if: github.ref == 'refs/heads/fix/safe-android-release-20261017'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "4.3.63"
          cp android/app/build/outputs/apk/debug/app-debug.apk POSDrops-4.3.63.apk
          cat > release-notes.txt <<'EOF'
          Android-Package: com.dropsdetergents.pos
          Android-Signer-SHA256: 8ae50d6d01c2e2d9ae82d2a1f4b00ba697d199beae3fba2b7c2f222aa34f0b63

          Drops POS 4.3.63 signed Android update. Back up POS data before updating. Android requires install confirmation.
          EOF
          if gh release view v4.3.63 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite signed APK'
            exit 1
          fi
          gh release create v4.3.63 POSDrops-4.3.63.apk --title 'Drops POS v4.3.63' --notes-file release-notes.txt --target "$GITHUB_SHA"
