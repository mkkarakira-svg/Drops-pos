name: Build Drops POS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare bundled offline web app
        run: |
          mkdir -p www
          cp index.html icon.svg manifest.webmanifest sw.js www/
      - name: Install Capacitor and generate Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Set POS Drops fullscreen and update version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/res/values/styles.xml')
          s = p.read_text()
          s = s.replace('</style>', '<item name="android:windowFullscreen">true</item>\n</style>', 1)
          p.write_text(s)
          p = Path('android/app/build.gradle')
          s = p.read_text()
          import re
          s, n = re.subn(r'versionCode\s+\d+', 'versionCode 2', s, count=1)
          assert n == 1, 'Could not find Android versionCode'
          p.write_text(s)
          PY
      - name: Check permanent signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.POS_DROPS_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.POS_DROPS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POS_DROPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POS_DROPS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Permanent signing credentials are not configured. Refusing to build an APK that cannot update existing installs."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pos-drops.jks"
          echo "POS_DROPS_KEYSTORE_PATH=$RUNNER_TEMP/pos-drops.jks" >> "$GITHUB_ENV"
      - name: Configure signed Android update
        env:
          STORE_PASSWORD: ${{ secrets.POS_DROPS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POS_DROPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POS_DROPS_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          signing="""
          android {
            signingConfigs {
              posDrops {
                storeFile file(System.getenv('POS_DROPS_KEYSTORE_PATH'))
                storePassword System.getenv('STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }
            buildTypes {
              debug {
                signingConfig signingConfigs.posDrops
              }
            }
          }
          """
          p.write_text(s+'\\n'+signing)
          PY
      - name: Build signed test APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.POS_DROPS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POS_DROPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POS_DROPS_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: DropsPOS-Android-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
