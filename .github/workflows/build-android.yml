name: Build Drops POS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'price-lists.js'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare bundled offline web app
        run: |
          mkdir -p www
          cp index.html icon.svg manifest.webmanifest sw.js price-lists.js www/
          npm install --no-audit --no-fund
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/
      - name: Install Capacitor and generate Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Install native Android package installer bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base=Path('android/app/src/main')
          java=base/'java/com/dropsdetergents/pos'
          java.mkdir(parents=True,exist_ok=True)
          (java/'DropsUpdaterPlugin.java').write_text("""package com.dropsdetergents.pos;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;
          import java.io.File;
          @CapacitorPlugin(name = "DropsUpdater")
          public class DropsUpdaterPlugin extends Plugin {
            @PluginMethod
            public void installApk(PluginCall call) {
              String path=call.getString("path");
              if(path==null){call.reject("Missing APK path");return;}
              File apk=new File(path);
              File cache=getContext().getCacheDir();
              try {
                String root=cache.getCanonicalPath()+File.separator;
                if(!apk.getCanonicalPath().startsWith(root) || !apk.getName().matches("POSDrops-[0-9.]+\\\\.apk") || !apk.isFile() || apk.length()<1000000){
                  call.reject("Untrusted or incomplete APK");return;
                }
                if(Build.VERSION.SDK_INT>=26 && !getContext().getPackageManager().canRequestPackageInstalls()){
                  Intent settings=new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,Uri.parse("package:"+getContext().getPackageName()));
                  settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(settings);
                  call.reject("Allow installs from POS Drops New, then tap Update again");return;
                }
                Uri uri=FileProvider.getUriForFile(getContext(),getContext().getPackageName()+".dropsupdate.fileprovider",apk);
                Intent intent=new Intent(Intent.ACTION_VIEW);
                intent.setDataAndType(uri,"application/vnd.android.package-archive");
                intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                intent.setClipData(android.content.ClipData.newRawUri("POS Drops update",uri));
                getContext().startActivity(intent);
                call.resolve();
              } catch(Exception e){call.reject("Installer error: "+e.getMessage());}
            }
            @PluginMethod
            public void downloadAndInstall(PluginCall call) {
              String url=call.getString("url");
              String version=call.getString("version");
              if(url==null || version==null || !version.matches("[0-9]+[.][0-9]+[.][0-9]+")
                 || !url.equals("https://github.com/mkkarakira-svg/Drops-pos/releases/download/v"+version+"/POSDrops-"+version+".apk")){
                call.reject("Unapproved update URL");return;
              }
              new Thread(() -> {
                File target=new File(getContext().getCacheDir(),"POSDrops-"+version+".apk");
                try {
                  java.net.URL current=new java.net.URL(url);
                  java.net.HttpURLConnection connection=null;
                  int redirects=0;
                  while(true) {
                    if(!"https".equals(current.getProtocol()))throw new Exception("Non-HTTPS download");
                    String host=current.getHost();
                    if(!host.equals("github.com") && !host.equals("release-assets.githubusercontent.com") && !host.equals("objects.githubusercontent.com"))
                      throw new Exception("Untrusted download host");
                    connection=(java.net.HttpURLConnection)current.openConnection();
                    connection.setConnectTimeout(20000);
                    connection.setReadTimeout(30000);
                    connection.setInstanceFollowRedirects(false);
                    connection.setRequestProperty("User-Agent","DropsPOS-Android");
                    int status=connection.getResponseCode();
                    if(status==301||status==302||status==303||status==307||status==308){
                      if(++redirects>6)throw new Exception("Too many redirects");
                      String location=connection.getHeaderField("Location");
                      if(location==null)throw new Exception("Missing redirect URL");
                      current=new java.net.URL(current,location);
                      connection.disconnect();
                      continue;
                    }
                    if(status!=200)throw new Exception("Download HTTP "+status);
                    break;
                  }
                  long total=0;
                  try(java.io.InputStream input=connection.getInputStream();
                      java.io.FileOutputStream output=new java.io.FileOutputStream(target)){
                    byte[] buffer=new byte[32768];int n;
                    while((n=input.read(buffer))!=-1){
                      total+=n;
                      if(total>120000000)throw new Exception("APK exceeds size limit");
                      output.write(buffer,0,n);
                    }
                    output.getFD().sync();
                  }finally{connection.disconnect();}
                  if(total<1000000)throw new Exception("APK incomplete");
                  android.content.pm.PackageInfo info=getContext().getPackageManager().getPackageArchiveInfo(
                    target.getAbsolutePath(),android.content.pm.PackageManager.GET_SIGNING_CERTIFICATES);
                  if(info==null || !"com.dropsdetergents.pos".equals(info.packageName) || info.signingInfo==null)
                    throw new Exception("APK package identity invalid");
                  android.content.pm.Signature[] signatures=info.signingInfo.getApkContentsSigners();
                  if(signatures==null || signatures.length!=1)throw new Exception("APK signer missing");
                  byte[] digest=java.security.MessageDigest.getInstance("SHA-256").digest(signatures[0].toByteArray());
                  StringBuilder hex=new StringBuilder();
                  for(byte value:digest)hex.append(String.format(java.util.Locale.ROOT,"%02x",value&255));
                  if(!hex.toString().equals("8ae50d6d01c2e2d9ae82d2a1f4b00ba697d199beae3fba2b7c2f222aa34f0b63"))
                    throw new Exception("APK signing certificate mismatch");
                  getActivity().runOnUiThread(() -> {
                    try {
                      if(Build.VERSION.SDK_INT>=26 && !getContext().getPackageManager().canRequestPackageInstalls()){
                        Intent settings=new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                          Uri.parse("package:"+getContext().getPackageName()));
                        getContext().startActivity(settings);
                        call.reject("Allow installs from POS Drops New, then tap Update again");return;
                      }
                      // PackageInstaller sessions request Android's actual user-confirmation
                      // UI via STATUS_PENDING_USER_ACTION instead of a silent VIEW intent.
                      android.content.pm.PackageInstaller installer=getContext().getPackageManager().getPackageInstaller();
                      android.content.pm.PackageInstaller.SessionParams params=
                        new android.content.pm.PackageInstaller.SessionParams(
                          android.content.pm.PackageInstaller.SessionParams.MODE_FULL_INSTALL);
                      params.setAppPackageName("com.dropsdetergents.pos");
                      int sessionId=installer.createSession(params);
                      try(android.content.pm.PackageInstaller.Session session=installer.openSession(sessionId)){
                        // PackageInstaller.commit requires every APK write stream to be CLOSED.
                        try(java.io.FileInputStream input=new java.io.FileInputStream(target);
                            java.io.OutputStream output=session.openWrite("base.apk",0,target.length())){
                          byte[] buf=new byte[32768];int count;
                          while((count=input.read(buf))!=-1)output.write(buf,0,count);
                          session.fsync(output);
                        }
                        Intent callback=new Intent(getContext(),DropsInstallReceiver.class);
                        callback.setAction("com.dropsdetergents.pos.INSTALL_STATUS");
                        callback.putExtra("sessionId",sessionId);
                        int flags=android.app.PendingIntent.FLAG_UPDATE_CURRENT;
                        if(Build.VERSION.SDK_INT>=31)flags|=android.app.PendingIntent.FLAG_MUTABLE;
                        android.app.PendingIntent pending=android.app.PendingIntent.getBroadcast(
                          getContext(),sessionId,callback,flags);
                        session.commit(pending.getIntentSender());
                      }
                      com.getcapacitor.JSObject result=new com.getcapacitor.JSObject();
                      result.put("stage","installer_session_submitted");
                      call.resolve(result);
                    }catch(Exception e){call.reject("Installer: "+e.getMessage());}
                  });
                }catch(Exception e){
                  target.delete();
                  call.reject("Download: "+e.getMessage());
                }
              }).start();
            }
          }
          """.replace('\\\\.apk','\\\\.apk'))
          (java/'DropsInstallReceiver.java').write_text("""package com.dropsdetergents.pos;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;
          import android.os.Build;
          import android.widget.Toast;
          public class DropsInstallReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context context,Intent intent){
              int status=intent.getIntExtra(PackageInstaller.EXTRA_STATUS,PackageInstaller.STATUS_FAILURE);
              if(status==PackageInstaller.STATUS_PENDING_USER_ACTION){
                Intent confirmation;
                if(Build.VERSION.SDK_INT>=33){
                  confirmation=intent.getParcelableExtra(Intent.EXTRA_INTENT,Intent.class);
                }else{
                  confirmation=(Intent)intent.getParcelableExtra(Intent.EXTRA_INTENT);
                }
                if(confirmation!=null){
                  confirmation.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  context.startActivity(confirmation);
                }else{
                  Toast.makeText(context,"Android did not return an installer screen",Toast.LENGTH_LONG).show();
                }
              }else if(status!=PackageInstaller.STATUS_SUCCESS){
                String message=intent.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE);
                Toast.makeText(context,"Update failed: "+status+" "+(message==null?"":message),Toast.LENGTH_LONG).show();
              }
            }
          }
          """)
          main=java/'MainActivity.java'
          main.write_text("""package com.dropsdetergents.pos;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle savedInstanceState) {
              registerPlugin(DropsUpdaterPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          """)
          paths=base/'res/xml/drops_update_paths.xml'
          paths.parent.mkdir(parents=True,exist_ok=True)
          paths.write_text('<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="update_apk" path="." /></paths>')
          manifest=base/'AndroidManifest.xml'
          ET.register_namespace('android','http://schemas.android.com/apk/res/android')
          tree=ET.parse(manifest)
          root=tree.getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          permission=ET.Element('uses-permission',{ns+'name':'android.permission.REQUEST_INSTALL_PACKAGES'})
          root.insert(0,permission)
          app=root.find('application')
          assert app is not None
          provider=ET.SubElement(app,'provider',{
            ns+'name':'androidx.core.content.FileProvider',
            ns+'authorities':'${applicationId}.dropsupdate.fileprovider',
            ns+'exported':'false',
            ns+'grantUriPermissions':'true'
          })
          ET.SubElement(provider,'meta-data',{
            ns+'name':'android.support.FILE_PROVIDER_PATHS',
            ns+'resource':'@xml/drops_update_paths'
          })
          ET.SubElement(app,'receiver',{
            ns+'name':'.DropsInstallReceiver',
            ns+'exported':'false'
          })
          tree.write(manifest,encoding='utf-8',xml_declaration=True)
          PY
      - name: Verify application identity and version
        run: |
          node -e "const c=require('./capacitor.config.json');const p=require('./package.json');if(c.appId!=='com.dropsdetergents.pos'||p.version!=='4.3.91')process.exit(1)"
      - name: Set Android version metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          import re
          s, n1 = re.subn(r"versionCode\s+\d+", "versionCode 4391", s, count=1)
          s, n2 = re.subn(r"versionName\s+['\"][^'\"]+['\"]", "versionName '4.3.91'", s, count=1)
          assert n1 == 1 and n2 == 1, "Missing Android version fields"
          p.write_text(s)
          PY
      - name: Restore permanent signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.DROPS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DROPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DROPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DROPS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || exit 1
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pos-drops.jks"
          test -s "$RUNNER_TEMP/pos-drops.jks"
          echo "POS_DROPS_KEYSTORE_PATH=$RUNNER_TEMP/pos-drops.jks" >> "$GITHUB_ENV"
      - name: Configure existing signing key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          p.write_text(p.read_text() + """
          android {
            signingConfigs {
              posDrops {
                storeFile file(System.getenv('POS_DROPS_KEYSTORE_PATH'))
                storePassword System.getenv('STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }
            buildTypes {
              debug {
                signingConfig signingConfigs.posDrops
              }
            }
          }
          """)
          PY
      - name: Build signed candidate APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.DROPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DROPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DROPS_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Inspect generated APK identity and signing certificate
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$AAPT" dump badging "$APK" | grep '^package:'
          "$APKSIGNER" verify --print-certs "$APK"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          test "$CERT" = '8ae50d6d01c2e2d9ae82d2a1f4b00ba697d199beae3fba2b7c2f222aa34f0b63' || { echo 'Signer mismatch'; exit 1; }
          "$AAPT" dump badging "$APK" | grep -q "versionCode='4391' versionName='4.3.91'"
          ACTUAL=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          test "$ACTUAL" = "com.dropsdetergents.pos" || { echo "Unexpected APK application ID: $ACTUAL"; exit 1; }
      - name: Verify same-app update identity
        run: |
          echo "This APK must update com.dropsdetergents.pos in place; never uninstall the installed app."
          echo "Do not uninstall the existing app. Test Android installer confirmation with a backup."
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: POSDrops-4.3.91-PRICE-LIST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish signed update v4.3.91
        if: github.ref == 'refs/heads/feature/pdf-price-share-4391'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "4.3.91"
          cp android/app/build/outputs/apk/debug/app-debug.apk POSDrops-4.3.91.apk
          cat > release-notes.txt <<'EOF'
          Android-Package: com.dropsdetergents.pos
          Android-Signer-SHA256: 8ae50d6d01c2e2d9ae82d2a1f4b00ba697d199beae3fba2b7c2f222aa34f0b63

          Drops POS 4.3.91 signed Android update. Back up POS data before updating. Android requires install confirmation.
          EOF
          if gh release view v4.3.91 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite signed APK'
            exit 1
          fi
          gh release create v4.3.91 POSDrops-4.3.91.apk --title 'Drops POS v4.3.91' --notes-file release-notes.txt --target "$GITHUB_SHA"
