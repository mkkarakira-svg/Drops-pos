name: Build Drops POS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Prepare bundled offline web app
        run: |
          mkdir -p www
          cp index.html icon.svg manifest.webmanifest sw.js www/
      - name: Install Capacitor and generate Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Set POS Drops fullscreen and update version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/res/values/styles.xml')
          s = p.read_text()
          # Apply fullscreen to every Android activity theme, not only the first style.
          import re
          s, count = re.subn(r'(</style>)', lambda m: '<item name="android:windowFullscreen">true</item>' + chr(10) + m.group(1), s)
          assert count >= 1, 'No Android styles found'
          p.write_text(s)
          # Enforce fullscreen at the native Activity level on Samsung/Android.
          activity = Path('android/app/src/main/java/com/dropsdetergents/posdrops/stable/MainActivity.java')
          if not activity.exists():
            matches = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
            assert len(matches) == 1, f'Expected one MainActivity.java: {matches}'
            activity = matches[0]
          java = activity.read_text()
          java = java.replace('public class MainActivity extends BridgeActivity {',
              'public class MainActivity extends BridgeActivity {' + chr(10)
              '  @Override public void onCreate(android.os.Bundle savedInstanceState) {' + chr(10)
              '    super.onCreate(savedInstanceState);' + chr(10)
              '    getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN, '
              'android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN);' + chr(10)
              '  }')
          assert 'FLAG_FULLSCREEN' in java, 'Native fullscreen injection failed'
          activity.write_text(java)
          p = Path('android/app/build.gradle')
          s = p.read_text()
          import re
          s, n = re.subn(r'versionCode\s+\d+', 'versionCode 60', s, count=1)
          assert n == 1, 'Could not find Android versionCode'
          s, n = re.subn(r'versionName\s+["\'][^"\']+["\']', 'versionName "4.3.60"', s, count=1)
          assert n == 1, 'Could not find Android versionName'
          p.write_text(s)
          PY
      - name: Check permanent signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.DROPS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DROPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DROPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DROPS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Permanent signing credentials are not configured. Refusing to build an APK that cannot update existing installs."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pos-drops.jks"
          echo "POS_DROPS_KEYSTORE_PATH=$RUNNER_TEMP/pos-drops.jks" >> "$GITHUB_ENV"
      - name: Configure signed Android update
        env:
          STORE_PASSWORD: ${{ secrets.DROPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DROPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DROPS_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          signing="""
          android {
            signingConfigs {
              posDrops {
                storeFile file(System.getenv('POS_DROPS_KEYSTORE_PATH'))
                storePassword System.getenv('STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }
            buildTypes {
              debug {
                signingConfig signingConfigs.posDrops
              }
            }
          }
          """
          p.write_text(s+chr(10)+signing)
          PY
      - name: Build signed test APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.DROPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DROPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DROPS_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish signed POS Drops update
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pos-drops-test-isolated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk POS-Drops-update.apk
          gh release create v4.3.60 POS-Drops-update.apk --title "POS Drops v4.3.60" --notes "Fullscreen and Android update checker. New permanent-signing app identity; install alongside earlier test app and restore your saved backup once." --target "$GITHUB_SHA"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: DropsPOS-Android-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
