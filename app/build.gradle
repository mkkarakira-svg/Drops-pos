plugins { id 'com.android.application' }

android {
    namespace 'com.drops.pos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.drops.pos.next'
        minSdk 23
        targetSdk 35
        versionCode 24
        versionName '4.2.3'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('DROPS_KEYSTORE_FILE') ?: 'drops-release.jks')
            storePassword System.getenv('DROPS_KEYSTORE_PASSWORD')
            keyAlias System.getenv('DROPS_KEY_ALIAS')
            keyPassword System.getenv('DROPS_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
