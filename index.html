<header class="top"><button id="headerBack" onclick="goHome()" style="display:none">← رجوع</button><b>DROPS DETERGENTS</b><div>USD/LBP <strong id="headerFx">90,000</strong></div></header><main class="wrap" id="app"></main>
<nav class="nav"><button onclick="go('home')" id="n-home">⌂<br>الرئيسية</button><button onclick="go('products')" id="n-products">📦<br>المنتجات</button><button onclick="go('sale')" id="n-sale">🛒<br>بيع</button><button onclick="go('reports')" id="n-reports">▤<br>التقارير</button><button onclick="go('settings')" id="n-settings">☰<br>المزيد</button></nav>
<script>
const $=s=>document.querySelector(s), money=n=>'$'+(+n||0).toFixed(2), today=()=>new Date().toISOString().slice(0,10);
let db=JSON.parse(localStorage.getItem('dropsDB')||'null')||{products:[],raw:[],recipes:[],batches:[],invoices:[],expenses:[],purchases:[],people:[],settings:{usdLbp:90000}};
db.products=db.products||[];db.raw=db.raw||[];db.recipes=db.recipes||[];db.batches=db.batches||[];db.invoices=db.invoices||[];db.expenses=db.expenses||[];db.purchases=db.purchases||[];db.people=db.people||[];db.settings=db.settings||{usdLbp:90000};
db.rawMoves=db.rawMoves||[];db.stockMoves=db.stockMoves||[];db.packings=db.packings||[];db.adjustments=db.adjustments||[];
let cart={}; const save=()=>localStorage.setItem('dropsDB',JSON.stringify(db)); const id=()=>Date.now()+Math.floor(Math.random()*999);
function seed(){if(!db.products.length){['Dishwashing 1L','Dishwashing 4L','Laundry Gel 1L','Laundry Gel 4L','Hand Soap 1L','Hand Soap 4L','Floor Cleaner 4L'].forEach((n,i)=>db.products.push({id:id()+i,name:n,price:[2.56,2.56,2.89,2.89,3.11,3.11,2.22][i],qty:0,cost:0,size:+((n.match(/([0-9.]+)L/)||[,1])[1])}));save()}}seed();
function nav(x){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let n=$('#n-'+x);if(n)n.classList.add('active')}
let currentView='home';
function go(x,fromHistory=false){
 currentView=x;
 document.body.classList.toggle('home-view',x==='home');
 const th=document.querySelector('.top'); if(th) th.classList.toggle('has-back',x!=='home');
 nav(x);
 if(!fromHistory) history.pushState({dropsView:x},'',location.href);
 ({home,sale,products,reports,raw,production,purchases,expenses,invoices,people,settings}[x]||home)();
}
function home(){
 currentView='home';document.body.classList.add('home-view');const th=document.querySelector('.top');if(th)th.classList.remove('has-back');nav('home');
 let d=db.invoices.filter(x=>x.date===today()),sales=d.reduce((a,x)=>a+x.total,0),
 exp=db.expenses.filter(x=>x.date===today()).reduce((a,x)=>a+x.amount,0),
 profit=d.reduce((a,v)=>a+v.items.reduce((s,i)=>s+(i.price-i.cost)*i.qty,0),0)-exp,
 stock=db.products.reduce((a,p)=>a+p.qty*p.cost,0),rawStock=db.raw.reduce((a,r)=>a+(+r.qty||0)*(+r.cost||0),0),low=db.products.filter(p=>p.qty<=5).length,
 buys=db.purchases.filter(x=>x.date===today()).reduce((a,x)=>a+x.qty*x.cost,0);
 $('#app').innerHTML=`
 <div class="kpi-grid">
  <div class="kpi-card"><span class="ico">📈</span><b>مبيعات اليوم</b><div class="kpi">${money(sales)}</div><span class="muted">${d.length} فاتورة</span></div>
  <div class="kpi-card"><span class="ico">🧾</span><b>مشتريات اليوم</b><div class="kpi">${money(buys)}</div><span class="muted">${db.purchases.filter(x=>x.date===today()).length} عملية</span></div>
  <div class="kpi-card"><span class="ico">📦</span><b>المخزون</b><div class="kpi">${money(stock)}</div><span class="muted">${low} تنبيه</span></div>
  <div class="kpi-card"><span class="ico">🪙</span><b>صافي الربح</b><div class="kpi">${money(profit)}</div><span class="muted">تقديري</span></div>
 </div>
 <div class="quick-grid inventory-value-row" style="margin-bottom:12px"><div class="kpi-card raw-value"><div class="muted">🧪 قيمة المواد الأولية</div><b>${money(rawStock)}</b></div><div class="kpi-card finished-value"><div class="muted">📦 قيمة البضاعة الجاهزة</div><b>${money(stock)}</b></div></div><div class="section-title">العمليات الرئيسية</div>
 <div class="main-grid">
  ${actionCard('🛒','بيع','sale','#2473f3')}${actionCard('🏭','إنتاج','production','#11b85b')}
  ${actionCard('🧾','مشتريات','purchases','#ff7900')}${actionCard('📦','مخزون','products','#6236e8')}
 </div>
 <div class="panel" onclick="leftovers()" style="cursor:pointer;font-weight:800">🧴 فضلات / 1L</div><div class="section-title">الإدارة</div>
 <div class="admin-grid">
  ${adminCard('👥','العملاء','people')}${adminCard('📊','التقارير','reports')}${adminCard('⚙️','الإعدادات','settings')}
 </div>
 <div class="section-title">معلومات سريعة</div>
 <div class="quick-grid">
  <div class="quick-card" onclick="go('products')"><span>🏷️ المنتجات<br><b>${db.products.length}</b></span><span>‹</span></div>
  <div class="quick-card" onclick="go('products')"><span>🔔 تنبيهات المخزون<br><b>${low}</b></span><span>‹</span></div>
 </div>`;
}
function actionCard(i,t,g,color){return `<div class="action-card" style="background:${color}" onclick="go('${g}')"><span class="ico">${i}</span><b>${t}</b><span class="arrow">‹</span></div>`}
function adminCard(i,t,g){return `<div class="admin-card" onclick="go('${g}')"><span class="ico">${i}</span><b>${t}</b></div>`}
function card(i,t,g){return `<div class="card" onclick="go('${g}')"><span class="ico">${i}</span><b>${t}</b><span class="muted">فتح</span></div>`} function homeCard(i,t,g,color){return `<div class="card" style="background:${color};color:white" onclick="go('${g}')"><span class="ico">${i}</span><b>${t}</b></div>`}
function products(){nav('products');$('#app').innerHTML=`<div class="title">المنتجات والمخزون</div><div class="panel"><div class="row"><input id="pn" placeholder="اسم المنتج"><input id="pp" type="number" step=".01" placeholder="سعر البيع $"><input id="ps" type="number" step=".1" placeholder="الحجم L"><button onclick="addProduct()">إضافة</button></div></div><div class="panel" id="plist"></div>`;renderProducts()}
function renderProducts(){let h=db.products.map(p=>`<div class="item"><b>${p.name}</b> <span class="pill">المخزون ${p.qty}</span><div class="muted">بيع ${money(p.price)} • كلفة ${money(p.cost)}</div><div class="row" style="margin-top:8px"><input id="q${p.id}" type="number" placeholder="+ كمية"><button class="green" onclick="stockIn(${p.id})">إدخال مخزون</button><button onclick="editP(${p.id})">تعديل</button></div></div>`).join('');$('#plist').innerHTML=h||'لا يوجد منتجات'}
function addProduct(){let n=$('#pn').value.trim(),p=+$(' #pp'.trim()).value,s=+$(' #ps'.trim()).value||1;if(!n)return;db.products.push({id:id(),name:n,price:p,qty:0,cost:0,size:s});save();products()}
function stockIn(i){let p=db.products.find(x=>x.id===i),q=+$('#q'+i).value;if(q>0){p.qty+=q;db.stockMoves.unshift({id:id(),date:today(),time:new Date().toISOString(),type:'adjustment_in',productId:p.id,name:p.name,qty:q,balance:p.qty});db.adjustments.unshift({id:id(),date:today(),time:new Date().toISOString(),productId:p.id,name:p.name,qty:q,note:'Manual stock in'});save();renderProducts()}}
function editP(i){let p=db.products.find(x=>x.id===i),pr=prompt('سعر البيع',p.price),q=prompt('الكمية',p.qty);if(pr!==null)p.price=+pr;if(q!==null)p.qty=+q;save();renderProducts()}
function sale(){nav('sale');$('#app').innerHTML=`<div class="title">نقطة البيع</div><div class="panel"><div class="row"><select id="sp">${db.products.map(p=>`<option value="${p.id}">${p.name} — ${money(p.price)} — مخزون ${p.qty}</option>`).join('')}</select><input id="sq" type="number" value="1" min="1"><button onclick="cartAdd()">إضافة للسلة</button></div></div><div class="panel" id="cart"></div>`;renderCart()}
function cartAdd(){let i=+$('#sp').value,q=+$('#sq').value||1;cart[i]=(cart[i]||0)+q;renderCart()}
function renderCart(){let total=0,h=Object.entries(cart).map(([i,q])=>{let p=db.products.find(x=>x.id==i);if(!p)return'';total+=p.price*q;return `<div class="item"><b>${p.name}</b> × ${q}<span style="float:left">${money(p.price*q)}</span><button class="danger" style="padding:5px 9px;margin-right:8px" onclick="delete cart[${i}];renderCart()">×</button></div>`}).join('');$('#cart').innerHTML=h+`<h2>المجموع: ${money(total)}</h2><div class="row"><input id="paid" type="number" step=".01" placeholder="المدفوع"><button class="green" onclick="checkout()">إتمام البيع</button></div>`}
function checkout(){let entries=Object.entries(cart);if(!entries.length)return alert('السلة فارغة');for(let[i,q]of entries){let p=db.products.find(x=>x.id==i);if(!p||p.qty<q)return alert('المخزون غير كافٍ: '+(p?p.name:''))}let items=[],total=0;entries.forEach(([i,q])=>{let p=db.products.find(x=>x.id==i);p.qty-=q;db.stockMoves.unshift({id:id(),date:today(),time:new Date().toISOString(),type:'sale',productId:p.id,name:p.name,qty:-q,balance:p.qty});items.push({productId:p.id,name:p.name,qty:+q,price:p.price,cost:p.cost});total+=p.price*q});let inv={id:id(),date:today(),time:new Date().toLocaleTimeString(),items,total,paid:+$('#paid').value||total};db.invoices.unshift(inv);cart={};save();invoiceView(inv.id)}

function production(){let bulk=db.products.filter(p=>+(p.size||0)===4||+(p.size||0)===5),opts=bulk.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');let formulaNames=["Dishwashing","Hand Soap","Laundry Gel","Comfort","Floor Cleaner","Pine Oil","Javel","Flash","Easy","Rambo","Shampoo","Balsam","Fresher","Tab","Car"],recipeProducts=formulaNames.map(n=>{let p=db.products.find(x=>String(x.name).toLowerCase()===n.toLowerCase());if(!p){p={id:id(),name:n,price:0,cost:0,qty:0,size:0,formulaMaster:true};db.products.push(p)}return p}),recipeOpts=recipeProducts.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');$('#app').innerHTML=`<div class="title">الإنتاج والطبخات</div><div class="panel"><b>تعريف وصفة لكل 1 لتر</b><div class="row" style="margin-top:10px"><select id="rp">${recipeOpts}</select><select id="rr">${db.raw.map(r=>`<option value="${r.id}">${r.name}</option>`)}</select><input id="rqpl" type="number" step=".001" placeholder="غرام لكل 1L"><button onclick="recipeAdd()">حفظ مادة</button></div></div><div class="panel"><b>تنفيذ طبخة</b><div class="row" style="margin-top:10px"><label>نوع الخلطة</label><select id="bp">${recipeOpts}</select><label>كمية الطبخة بالليتر</label><input id="bl" type="number" step=".1" placeholder="مثلاً 120"><label>التعبئة</label><select id="packSize"><option value="">بدون تعبئة الآن</option><option value="5">جالون 5 لتر</option><option value="4">جالون 4 لتر</option></select><button class="orange" onclick="produceAndPack()">إنتاج وتعبئة</button></div></div><div class="panel"><b>آخر الطبخات</b>${db.batches.map(b=>`<div class="item">${b.product} — ${b.liters} L <span style="float:left">${money(b.cost)}</span></div>`).join('')}</div>`}
function recipeAdd(){let p=$('#rp').value,r=$('#rr').value,g=+$('#rqpl').value,q=g/1000;p=db.products.find(x=>String(x.id)===String(p))?.id;r=db.raw.find(x=>String(x.id)===String(r))?.id;if(q<=0)return;db.recipes=db.recipes.filter(x=>!(x.productId===p&&x.rawId===r));db.recipes.push({productId:p,rawId:r,qtyPerLiter:q});save();alert('تم حفظ المادة بالوصفة')}
function produce(){let pid=$('#bp').value,L=+$('#bl').value,p=db.products.find(x=>String(x.id)===String(pid));if(p)pid=p.id;let rec=db.recipes.filter(x=>String(x.productId)===String(pid));if(!p||L<=0||!rec.length)return alert('الوصفة ناقصة');for(let x of rec){let r=db.raw.find(a=>String(a.id)===String(x.rawId)),need=x.qtyPerLiter*L;if(!r||r.qty<need)return alert('المادة غير كافية: '+(r?r.name:'')+'\nالمطلوب '+need.toFixed(3)+' kg\nالمتوفر '+(r?r.qty.toFixed(3):0)+' kg')}let cost=0,bid=id(),ts=new Date().toISOString();rec.forEach(x=>{let r=db.raw.find(a=>String(a.id)===String(x.rawId)),need=x.qtyPerLiter*L;r.qty-=need;cost+=need*r.cost;db.rawMoves.unshift({id:id(),batchId:bid,date:today(),time:ts,type:'production',rawId:r.id,name:r.name,qty:-need,balance:r.qty,cost:r.cost})});db.batches.unshift({id:bid,date:today(),time:ts,productId:p.id,product:p.name,liters:L,remainingLiters:L,cost,status:'open'});save();alert('تم حفظ الطبخة وخصم المواد الخام\nالكلفة '+money(cost)+'\nالمتبقي للتعبئة '+L+' L');production()}

function produceAndPack(){
 const pid=document.getElementById('bp').value,L=+document.getElementById('bl').value,size=+document.getElementById('packSize').value;
 const p0=db.products.find(x=>String(x.id)===String(pid)),rec=db.recipes.filter(x=>String(x.productId)===String(p0?.id));
 if(!p0||L<=0||!rec.length)return alert('الوصفة ناقصة');
 for(const x of rec){const r=db.raw.find(a=>String(a.id)===String(x.rawId)),need=x.qtyPerLiter*L;if(!r||r.qty<need)return alert('المادة غير كافية: '+(r?r.name:'')+'\nالمطلوب '+need.toFixed(3)+' kg\nالمتوفر '+(r?r.qty.toFixed(3):0)+' kg')}
 let pack=null,label=null,q=0;
 if(size){q=Math.floor(L/size);const pn=size===5?'Gallon 5L':size===4?'Gallon 4L':'Bottle 1L';pack=db.raw.find(r=>String(r.name).toLowerCase()===pn.toLowerCase());label=(size===4||size===5)?db.raw.find(r=>String(r.name).toLowerCase()==='label sticker'):null;if(!pack||pack.qty<q)return alert('العبوات الفارغة غير كافية: '+pn);if(label&&label.qty<q)return alert('الستيكرات غير كافية');}
 const bid=id(),ts=new Date().toISOString();let cost=0;
 rec.forEach(x=>{const r=db.raw.find(a=>String(a.id)===String(x.rawId)),need=x.qtyPerLiter*L;r.qty-=need;cost+=need*r.cost;db.rawMoves.unshift({id:id(),batchId:bid,date:today(),time:ts,type:'production',rawId:r.id,name:r.name,qty:-need,balance:r.qty,cost:r.cost})});
 const b={id:bid,date:today(),time:ts,productId:p0.id,product:p0.name,liters:L,remainingLiters:L,cost,status:'open'};db.batches.unshift(b);
 if(size){let baseName=String(p0.name).replace(/\s+(1|4|5)L\s*$/i,'').trim();let fp=db.products.find(x=>String(x.name).replace(/\s+(1|4|5)L\s*$/i,'').trim().toLowerCase()===baseName.toLowerCase()&&+(x.size||0)===size);if(!fp){fp={id:id(),name:baseName+' '+size+'L',price:0,cost:0,qty:0,size};db.products.push(fp)};pack.qty-=q;db.rawMoves.unshift({id:id(),batchId:bid,date:today(),time:ts,type:'packaging_use',rawId:pack.id,name:pack.name,qty:-q,balance:pack.qty,cost:pack.cost});if(label){label.qty-=q;db.rawMoves.unshift({id:id(),batchId:bid,date:today(),time:ts,type:'label_use',rawId:label.id,name:label.name,qty:-q,balance:label.qty,cost:label.cost})};fp.qty+=q;b.remainingLiters=L-q*size;if(b.remainingLiters<.0001){b.remainingLiters=0;b.status='closed'};fp.cost=(cost/L*size)+pack.cost+(label?label.cost:0);let mv={id:id(),batchId:bid,date:today(),time:ts,productId:fp.id,name:fp.name,qty:q,liters:q*size,balance:fp.qty,unitCost:fp.cost};db.packings.unshift(mv);db.stockMoves.unshift({...mv,type:'production_pack'});}
 save();alert(size?'تم الإنتاج والتعبئة: '+q+' × '+size+'L':'تم حفظ الطبخة وخصم المواد');production();
}

function packLeftover1L(bid){
 const b=db.batches.find(x=>String(x.id)===String(bid));if(!b)return;
 const q=+document.getElementById('lf'+b.id).value,remain=+(b.remainingLiters??0);
 if(!Number.isInteger(q)||q<1||q>Math.floor(remain))return alert('الكمية غير صحيحة');
 const bottle=db.raw.find(x=>String(x.name).toLowerCase()==='bottle 1l');
 if(!bottle||bottle.qty<q)return alert('قناني 1L الفارغة غير كافية');
 let p=db.products.find(x=>/laundry|washing/i.test(x.name)&&+(x.size||0)===1);
 if(!p){const base=db.products.find(x=>String(x.id)===String(b.productId));p={id:id(),name:(base?base.name:b.product)+' 1L',price:0,cost:0,qty:0,size:1};db.products.push(p);}
 bottle.qty-=q;db.rawMoves.unshift({id:id(),batchId:b.id,date:today(),time:new Date().toISOString(),type:'packaging_use',rawId:bottle.id,name:bottle.name,qty:-q,balance:bottle.qty,cost:bottle.cost});
 p.qty+=q;b.remainingLiters=remain-q;if(b.remainingLiters<.0001){b.remainingLiters=0;b.status='closed'}
 p.cost=(b.cost/b.liters)+bottle.cost;
 const mv={id:id(),batchId:b.id,date:today(),time:new Date().toISOString(),type:'leftover_1l',productId:p.id,name:p.name,qty:q,liters:q,balance:p.qty,unitCost:p.cost};
 db.packings.unshift(mv);db.stockMoves.unshift(mv);save();alert('تمت إضافة '+q+' قناني 1L إلى مخزون البيع');leftovers();
}

function packing(){
 let open=db.batches.filter(b=>(b.remainingLiters??b.liters)>0);
 $('#app').innerHTML='<div class="title">تعبئة الطبخات</div><div class="panel">'+(open.map(b=>'<div class="item"><b>'+b.product+'</b> — طبخة '+b.liters+' L<br><span class="muted">المتبقي '+(b.remainingLiters??b.liters).toFixed(2)+' L • '+b.date+'</span><div class="row" style="margin-top:8px"><select id="pkp'+b.id+'">'+db.products.map(p=>'<option value="'+p.id+'">'+p.name+' ('+(p.size||1)+'L)</option>').join('')+'</select><input id="pkq'+b.id+'" type="number" min="1" placeholder="عدد العبوات"><button onclick="packBatch('+b.id+')">تعبئة</button></div></div>').join('')||'لا يوجد طبخات مفتوحة')+'</div>';
}
function packBatch(bid){
 let b=db.batches.find(x=>String(x.id)===String(bid)),
     p=db.products.find(x=>String(x.id)===String(document.getElementById('pkp'+bid).value)),
     q=+document.getElementById('pkq'+bid).value;
 if(!b||!p||q<=0)return;
 let size=+(p.size||1),liters=q*size,remain=b.remainingLiters??b.liters;
 if(liters>remain+0.0001)return alert('الكمية أكبر من الليترات المتبقية: '+remain.toFixed(2)+' L');
 let packName=size===5?'Gallon 5L':size===4?'Gallon 4L':size===1?'Bottle 1L':'';
 let pack=packName?db.raw.find(r=>String(r.name).toLowerCase()===packName.toLowerCase()):null;
 let label=(size===4||size===5)?db.raw.find(r=>String(r.name).toLowerCase()==='label sticker'):null;
 if(pack && pack.qty<q)return alert('العبوات الفارغة غير كافية: '+packName+'\nالمطلوب '+q+'\nالمتوفر '+pack.qty);
 if(label && label.qty<q)return alert('الستيكرات غير كافية\nالمطلوب '+q+'\nالمتوفر '+label.qty);
 if(pack){pack.qty-=q;db.rawMoves.unshift({id:id(),batchId:b.id,date:today(),time:new Date().toISOString(),type:'packaging_use',rawId:pack.id,name:pack.name,qty:-q,balance:pack.qty,cost:pack.cost});}
 if(label){label.qty-=q;db.rawMoves.unshift({id:id(),batchId:b.id,date:today(),time:new Date().toISOString(),type:'label_use',rawId:label.id,name:label.name,qty:-q,balance:label.qty,cost:label.cost});}
 p.qty+=q;b.remainingLiters=remain-liters;if(b.remainingLiters<0.0001){b.remainingLiters=0;b.status='closed'}
 let liquidUnitCost=b.liters?b.cost*(liters/b.liters)/q:0,unitCost=liquidUnitCost+(pack?pack.cost:0)+(label?label.cost:0);
 p.cost=unitCost;
 let mv={id:id(),batchId:b.id,date:today(),time:new Date().toISOString(),productId:p.id,name:p.name,qty:q,liters,balance:p.qty,unitCost};
 db.packings.unshift(mv);db.stockMoves.unshift({...mv,type:'production_pack'});
 save();alert('تمت التعبئة: '+q+' × '+size+'L\nدخلت على مخزون البضاعة الجاهزة\nوتم خصم '+q+' عبوة فارغة'+(label?' + '+q+' ستيكر':'') );packing();
}
function historyReport(){

 ].filter(x=>x.date>=from&&x.date<=to).sort((a,b)=>String(b.time||b.date).localeCompare(String(a.time||a.date)));
 $('#app').innerHTML='<div class="title">سجل الحركات والتاريخ</div><div class="panel"><div class="row"><input id="histFrom" type="date" value="'+from+'"><input id="histTo" type="date" value="'+to+'"><button onclick="historyReport()">عرض</button></div></div><div class="panel">'+(all.map(x=>'<div class="item"><b>'+x.kind+'</b> — '+(x.name||'')+'<span style="float:left">'+(x.qty!==undefined?x.qty:'')+'</span><div class="muted">'+x.date+' • '+(x.type||'')+'</div></div>').join('')||'لا يوجد حركات ضمن الفترة')+'</div>';
}



function addRawMaterial(returnTo='raw'){
 const name=prompt('اسم المادة الجديدة'); if(!name||!name.trim())return;
 if(db.raw.some(r=>String(r.name).trim().toLowerCase()===name.trim().toLowerCase()))return alert('المادة موجودة مسبقاً');
 const cost=prompt('سعر الكيلو بالدولار','0'); if(cost===null)return;
 const qty=prompt('الكمية الحالية بالكيلو','0'); if(qty===null)return;
 const r={id:id(),name:name.trim(),cost:Math.max(0,+cost||0),qty:Math.max(0,+qty||0),unit:'kg'};
 db.raw.push(r);
 if(r.qty)db.rawMoves.unshift({id:id(),date:today(),time:new Date().toISOString(),type:'stock_in',rawId:r.id,name:r.name,qty:r.qty,balance:r.qty,cost:r.cost});
 save(); if(returnTo==='production')production(); else raw();
}


function editRawPrice(rid){
 const r=db.raw.find(x=>String(x.id)===String(rid));if(!r)return;
 const v=prompt('السعر الجديد للكيلو / الوحدة ($)',(+r.cost||0).toFixed(3));
