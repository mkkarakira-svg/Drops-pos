<script>
document.addEventListener('DOMContentLoaded',function(){var e=document.getElementById('headerDate'),d=new Date();if(e)e.textContent=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()});
const $=s=>document.querySelector(s), money=n=>'$'+(+n||0).toFixed(2), today=()=>new Date().toISOString().slice(0,10);
let db=JSON.parse(localStorage.getItem('dropsDB')||'null')||{products:[],raw:[],recipes:[],batches:[],invoices:[],expenses:[],purchases:[],people:[],settings:{usdLbp:90000}};
db.products=db.products||[];db.raw=db.raw||[];db.recipes=db.recipes||[];db.batches=db.batches||[];db.invoices=db.invoices||[];db.expenses=db.expenses||[];db.purchases=db.purchases||[];db.people=db.people||[];db.settings=db.settings||{usdLbp:90000};
db.rawMoves=db.rawMoves||[];db.stockMoves=db.stockMoves||[];db.packings=db.packings||[];db.adjustments=db.adjustments||[];
let cart={}; const save=()=>localStorage.setItem('dropsDB',JSON.stringify(db)); const id=()=>Date.now()+Math.floor(Math.random()*999);
function seed(){if(!db.products.length){['Dishwashing 1L','Dishwashing 4L','Laundry Gel 1L','Laundry Gel 4L','Hand Soap 1L','Hand Soap 4L','Floor Cleaner 4L'].forEach((n,i)=>db.products.push({id:id()+i,name:n,price:[2.56,2.56,2.89,2.89,3.11,3.11,2.22][i],qty:0,cost:0,size:+((n.match(/([0-9.]+)L/)||[,1])[1])}));save()}}seed();
function nav(x){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let n=$('#n-'+x);if(n)n.classList.add('active')}
let currentView='home';
function go(x,fromHistory=false){
 currentView=x;try{sessionStorage.setItem('dropsCurrentView',x)}catch(e){};if(location.hash!=='#'+x)history.replaceState({dropsView:x},'',location.pathname+location.search+'#'+x);document.body.classList.toggle('home-view',x==='home');
 const th=document.querySelector('.top');if(th)th.classList.toggle('has-back',x!=='home');
 nav(x);if(!fromHistory)history.pushState({dropsView:x},'',location.href);
 switch(x){
  case 'sale':return sale();case 'products':return products();case 'reports':return reports();
  case 'raw':return raw();case 'production':return production();case 'purchases':return purchases();
  case 'expenses':return expenses();case 'cashbox':return cashbox();case 'stocktake':return stocktake();case 'closingPage':return closingPage();case 'accountsPage':return accountsPage();case 'invoices':return invoices();case 'people':return people();
  case 'settings':return settings();case 'employees':return employees();
  case 'returnsPage':return returnsPage();case 'receivablesPage':return receivablesPage();
  default:return home();
 }
}

if(!db.products)db.products=[];if(!db.raw)db.raw=[];if(!db.recipes)db.recipes=[];if(!db.batches)db.batches=[];if(!db.invoices)db.invoices=[];if(!db.expenses)db.expenses=[];if(!db.purchases)db.purchases=[];if(!db.people)db.people=[];if(!db.settings)db.settings={usdLbp:90000};if(!db.rawMoves)db.rawMoves=[];if(!db.stockMoves)db.stockMoves=[];if(!db.packings)db.packings=[];if(!db.adjustments)db.adjustments=[];if(!db.employees)db.employees=[];if(!db.returns)db.returns=[];if(!db.receivables)db.receivables=[];if(!db.collections)db.collections=[];if(!db.cashMoves)db.cashMoves=[];if(!db.closings)db.closings=[];if(!db.commissionPayments)db.commissionPayments=[];
function closingSnapshotFor(period,autoFlag){
 var inv=(db.invoices||[]).filter(function(v){return !v.voided&&v.date===period});
 var ex=(db.expenses||[]).filter(function(x){return x.date===period});
 var moves=(db.cashMoves||[]).filter(function(x){return x.date===period});
 var sales=inv.reduce(function(a,x){return a+(+x.total||0)},0);
 var expenses=ex.reduce(function(a,x){return a+(+x.amount||0)},0);
 var gross=inv.reduce(function(a,v){return a+(v.items||[]).reduce(function(q,i){return q+((+i.price||0)-(+i.cost||0))*(+i.qty||0)},0)},0);
 var cashIn=moves.filter(function(x){return (+x.amount||0)>0}).reduce(function(a,x){return a+(+x.amount||0)},0);
 var cashOut=Math.abs(moves.filter(function(x){return (+x.amount||0)<0}).reduce(function(a,x){return a+(+x.amount||0)},0));
 var debt=inv.reduce(function(a,v){return a+Math.max(0,(+v.total||0)-(+v.paid||0))},0);
 return {id:id(),type:'day',period:period,date:today(),sales:sales,expenses:expenses,gross:gross,net:gross-expenses,cashIn:cashIn,cashOut:cashOut,debt:debt,auto:!!autoFlag};
}
function autoEndOfDay(){
 var d=today(),last=db.settings.lastBusinessDate;
 if(!last){db.settings.lastBusinessDate=d;save();return}
 if(last===d)return;
 var exists=(db.closings||[]).some(function(c){return c.type==='day'&&c.period===last});
 if(!exists)db.closings.unshift(closingSnapshotFor(last,true));
 db.settings.lastBusinessDate=d;save();
}
autoEndOfDay();
function home(){
 currentView='home';document.body.classList.add('home-view');const th=document.querySelector('.top');if(th)th.classList.remove('has-back');nav('home');
 let d=db.invoices.filter(x=>x.date===today()&&!x.voided),sales=d.reduce((a,x)=>a+x.total,0),
 exp=db.expenses.filter(x=>x.date===today()).reduce((a,x)=>a+x.amount,0),
 profit=d.reduce((a,v)=>a+v.items.reduce((s,i)=>s+(i.price-i.cost)*i.qty,0),0)-exp,
 stock=db.products.reduce((a,p)=>a+p.qty*p.cost,0),rawStock=db.raw.reduce((a,r)=>a+(+r.qty||0)*(+r.cost||0),0),low=db.products.filter(p=>p.qty<=5).length,
 buys=(db.purchases||[]).filter(x=>x.date===today()).reduce((a,x)=>a+(+x.qty||0)*(+x.cost||0),0);
 $('#app').innerHTML=`
 <div class="kpi-grid">

  <div class="kpi-card"><span class="ico">🧾</span><b>Today's Purchases</b><div class="kpi">${money(buys)}</div><span class="muted">${(db.purchases||[]).filter(x=>x.date===today()).length} Transaction</span></div>
  <div class="kpi-card"><span class="ico">📦</span><b>Inventory</b><div class="kpi">${money(stock)}</div><span class="muted">${low} Alert</span></div>
  <div class="kpi-card"><span class="ico">🪙</span><b>Net Profit</b><div class="kpi">${money(profit)}</div><span class="muted">Estimated</span></div>
 </div>
 <div class="quick-grid inventory-value-row" style="margin-bottom:12px"><div class="kpi-card raw-value"><div class="muted">🧪 Raw Materials Value</div><b>${money(rawStock)}</b></div><div class="kpi-card finished-value"><div class="muted">📦 Finished Goods Value</div><b>${money(stock)}</b></div></div><div class="section-title">Main Operations</div>
 <div class="main-grid">
  ${actionCard('🛒','Sales','sale','#2473f3')}${actionCard('🏭','Production','production','#11b85b')}
  ${actionCard('🧾','Purchases','purchases','#ff7900')}${actionCard('📦','Stock','products','#6236e8')}
 </div>
 <div class="panel" onclick="leftovers()" style="cursor:pointer;font-weight:800">🧴 Leftovers / 1L</div><div class="panel" onclick="products()"><b>⚠️ Stock Alert</b><div class="muted">${db.products.filter(p=>!p.formulaMaster&&(+p.qty||0)<=5).length} Low / Out of Stock Product • ${db.raw.filter(r=>(+r.qty||0)<=10).length} Low Raw/Packaging</div></div><div class="section-title">Management</div>
 <div class="admin-grid">
  ${adminCard('👥','Customers','people')}${adminCard('💵','Cashbox','cashbox')}${adminCard('📋','Physical Stocktake','stocktake')}${adminCard('🔒','Daily / Monthly Closing','closingPage')}${adminCard('📒','Customer & Supplier Accounts','accountsPage')}${adminCard('🧑‍💼','Employees & Distributors','employees')}${adminCard('↩️','Returns','returnsPage')}${adminCard('💳','Receivables & Collections','receivablesPage')}${adminCard('💸','Expenses','expenses')}${adminCard('📊','Reports','reports')}${adminCard('⚙️','Settings','settings')}

}
function actionCard(i,t,g,color){return `<div class="action-card" style="background:${color}" onclick="go('${g}')"><span class="ico">${i}</span><b>${t}</b><span class="arrow">‹</span></div>`}

function card(i,t,g){return `<div class="card" onclick="go('${g}')"><span class="ico">${i}</span><b>${t}</b><span class="muted">Open</span></div>`} function homeCard(i,t,g,color){return `<div class="card" style="background:${color};color:white" onclick="go('${g}')"><span class="ico">${i}</span><b>${t}</b></div>`}
function allowedPackSizes(base){let n=String(base||'').replace(/\s+(1|4|5|10|20)L\s*$/i,'').trim().toLowerCase();if(n==='car')return [10,20];if(['laundry gel','laundrey gel','dishwashing','comfort','fabric softner','fabric softener','floor cleaner'].includes(n))return [1,4,5];return [1,4]}
function finishedFamilies(){const names=["Dishwashing","Hand Soap","Laundry Gel","Comfort","Floor Cleaner","Pine Oil","Javel","Flash","Easy","Rambo","Shampoo","Balsam","Fresher","Tab","Car"],norm=n=>String(n||'').replace(/\s+(1|4|5|10|20)L\s*$/i,'').trim().toLowerCase();return names.map(name=>({name,items:[1,4,5,10,20].map(size=>allowedPackSizes(name).includes(size)?(db.products.find(p=>norm(p.name)===name.toLowerCase()&&+(p.size||0)===size)||null):null)}))}function ensureFinishedProduct(base,size){const norm=n=>String(n||'').replace(/\s+(1|4|5|10|20)L\s*$/i,'').trim().toLowerCase();let p=db.products.find(x=>norm(x.name)===norm(base)&&+(x.size||0)===size);if(!p){p={id:id(),name:base+' '+size+'L',price:0,cost:0,qty:0,size};db.products.push(p)}return p}

function rawCategoryOf(r){
 if(r.category)return r.category;
 let n=String(r.name||'').toLowerCase();
 if(/gallon|bottle|cap|label|spray|pump|jar|plastic/.test(n))return 'Plastic & Packaging';
 if(/carton|box|bag|sack/.test(n))return 'Bags & Cartons';
 return 'Raw Materials';
}

function produce(){let pid=$('#bp').value,L=+$('#bl').value,p=db.products.find(x=>String(x.id)===String(pid));if(p)pid=p.id;let rec=db.recipes.filter(x=>String(x.productId)===String(pid));if(!p||L<=0||!rec.length)return alert('Recipe is incomplete');for(let x of rec){let r=db.raw.find(a=>String(a.id)===String(x.rawId)),need=x.qtyPerLiter*L;if(!r||r.qty<need)return alert('Insufficient material: '+(r?r.name:'')+'\nRequired '+need.toFixed(3)+' kg\nAvailable '+(r?r.qty.toFixed(3):0)+' kg')}let cost=0,bid=id(),ts=new Date().toISOString();rec.forEach(x=>{let r=db.raw.find(a=>String(a.id)===String(x.rawId)),need=x.qtyPerLiter*L;r.qty-=need;cost+=need*r.cost;db.rawMoves.unshift({id:id(),batchId:bid,date:today(),time:ts,type:'production',rawId:r.id,name:r.name,qty:-need,balance:r.qty,cost:r.cost})});db.batches.unshift({id:bid,date:today(),time:ts,productId:p.id,product:p.name,liters:L,remainingLiters:L,cost,status:'open'});save();alert('Batch saved and raw materials deducted\nCost '+money(cost)+'\nRemaining to Pack '+L+' L');production()}

function produceAndPack(){
 const pid=document.getElementById('bp').value,L=+document.getElementById('bl').value,size=+document.getElementById('packSize').value;
 const p0=db.products.find(x=>String(x.id)===String(pid)),rec=db.recipes.filter(x=>String(x.productId)===String(p0?.id));
 if(!p0||L<=0||!rec.length)return alert('Recipe is incomplete');
 for(const x of rec){const r=db.raw.find(a=>String(a.id)===String(x.rawId)),need=x.qtyPerLiter*L;if(!r||r.qty<need)return alert('Insufficient material: '+(r?r.name:'')+'\nRequired '+need.toFixed(3)+' kg\nAvailable '+(r?r.qty.toFixed(3):0)+' kg')}
 let pack=null,label=null,q=0;
 if(size){q=Math.floor(L/size);const pn=size===20?'Gallon 20L':size===10?'Gallon 10L':size===5?'Gallon 5L':size===4?'Gallon 4L':'Bottle 1L';pack=db.raw.find(r=>String(r.name).toLowerCase()===pn.toLowerCase());label=(size===4||size===5)?db.raw.find(r=>String(r.name).toLowerCase()==='label sticker'):null;if(!pack||pack.qty<q)return alert('Not enough empty containers: '+pn);if(label&&label.qty<q)return alert('Not enough labels');}
 const bid=id(),ts=new Date().toISOString();let cost=0;
 rec.forEach(x=>{const r=db.raw.find(a=>String(a.id)===String(x.rawId)),need=x.qtyPerLiter*L;r.qty-=need;cost+=need*r.cost;db.rawMoves.unshift({id:id(),batchId:bid,date:today(),time:ts,type:'production',rawId:r.id,name:r.name,qty:-need,balance:r.qty,cost:r.cost})});
 const b={id:bid,date:today(),time:ts,productId:p0.id,product:p0.name,liters:L,remainingLiters:L,cost,status:'open'};db.batches.unshift(b);
 if(size){let baseName=String(p0.name).replace(/\s+(1|4|5|10|20)L\s*$/i,'').trim();let fp=ensureFinishedProduct(baseName,size);pack.qty-=q;db.rawMoves.unshift({id:id(),batchId:bid,date:today(),time:ts,type:'packaging_use',rawId:pack.id,name:pack.name,qty:-q,balance:pack.qty,cost:pack.cost});if(label){label.qty-=q;db.rawMoves.unshift({id:id(),batchId:bid,date:today(),time:ts,type:'label_use',rawId:label.id,name:label.name,qty:-q,balance:label.qty,cost:label.cost})};fp.qty+=q;b.remainingLiters=L-q*size;if(b.remainingLiters<.0001){b.remainingLiters=0;b.status='closed'};fp.cost=(cost/L*size)+pack.cost+(label?label.cost:0);let mv={id:id(),batchId:bid,date:today(),time:ts,productId:fp.id,name:fp.name,qty:q,liters:q*size,balance:fp.qty,unitCost:fp.cost};db.packings.unshift(mv);db.stockMoves.unshift({...mv,type:'production_pack'});}
 save();alert(size?'Production and packing completed: '+q+' × '+size+'L':'Batch saved and materials deducted');production();
}

function reportDrill(type){
 var from=document.getElementById('repFrom')?document.getElementById('repFrom').value:today();
 var to=document.getElementById('repTo')?document.getElementById('repTo').value:today();
 var inv=(db.invoices||[]).filter(function(v){return !v.voided&&v.date>=from&&v.date<=to});
 var ex=(db.expenses||[]).filter(function(e){return e.date>=from&&e.date<=to});
 var ba=(db.batches||[]).filter(function(e){return e.date>=from&&e.date<=to});
 var items=[];inv.forEach(function(v){(v.items||[]).forEach(function(i){items.push(i)})});
 var title='',rows=[];
 if(type==='sales'||type==='invoices'){title=type==='sales'?'Sales Breakdown':'Invoice Breakdown';rows=inv.map(function(v){return '<div class="item" onclick="invoiceView('+v.id+')"><b>Invoice #'+v.id+'</b><span style="float:left">'+money(v.total)+'</span><div class="muted">'+v.date+'</div></div>'})}
 if(type==='units'||type==='liters'){title='Packs Sold Breakdown';var m={};items.forEach(function(i){var n=i.name||'منتج',mt=String(n).match(/(1|4|5|10|20)L/i),sz=mt?Number(mt[1]):0;if(!m[n])m[n]={q:0,sz:sz};m[n].q+=Number(i.qty)||0});Object.keys(m).forEach(function(n){var v=m[n],unit=v.sz===1?'Bottle':'Gallon';rows.push('<div class="item"><b>'+n+'</b><span style="float:left">'+v.q+' '+unit+'</span></div>')})}
 if(type==='gross'){title='Gross Profit Breakdown';rows=items.map(function(i){var p=((Number(i.price)||0)-(Number(i.cost)||0))*(Number(i.qty)||0);return '<div class="item"><b>'+i.name+' × '+i.qty+'</b><span style="float:left">'+money(p)+'</span><div class="muted">Sales '+money(i.price)+' • Cost '+money(i.cost)+'</div></div>'})}
 if(type==='expenses'){title='تفصيل Expenses';rows=ex.map(function(e){return '<div class="item"><b>'+(e.name||e.category||'مصروف')+'</b><span style="float:left">'+money(e.amount)+'</span><div class="muted">'+e.date+'</div></div>'})}
 if(type==='net'){title='Net Profit Breakdown';var g=items.reduce(function(a,i){return a+((Number(i.price)||0)-(Number(i.cost)||0))*(Number(i.qty)||0)},0),ee=ex.reduce(function(a,e){return a+(Number(e.amount)||0)},0);rows=['<div class="item"><b>Gross Profit</b><span style="float:left">'+money(g)+'</span></div>','<div class="item"><b>Expenses</b><span style="float:left">-'+money(ee)+'</span></div>','<div class="item"><b>Net</b><span style="float:left"><b>'+money(g-ee)+'</b></span></div>']}
 if(type==='raw'){title='Raw Materials Value Breakdown';rows=(db.raw||[]).filter(function(r){return Number(r.qty)||0}).map(function(r){return '<div class="item"><b>'+r.name+'</b><span style="float:left">'+money((Number(r.qty)||0)*(Number(r.cost)||0))+'</span><div class="muted">'+(Number(r.qty)||0)+' × '+money(r.cost)+'</div></div>'})}
 if(type==='finished'){title='Finished Goods Value Breakdown';rows=(db.products||[]).filter(function(p){return !p.formulaMaster&&(Number(p.qty)||0)}).map(function(p){return '<div class="item"><b>'+p.name+'</b><span style="float:left">'+money((Number(p.qty)||0)*(Number(p.cost)||0))+'</span><div class="muted">'+(Number(p.qty)||0)+' × '+money(p.cost)+'</div></div>'})}
 if(type==='batches'){title='Batch Breakdown';rows=ba.map(function(x){return '<div class="item"><b>'+(x.product||x.name||'Batch')+'</b><span style="float:left">'+(Number(x.liters)||0)+' L</span><div class="muted">'+x.date+'</div></div>'})}
 document.getElementById('app').innerHTML='<div class="title">'+title+'</div><div class="panel"><button onclick="reports()">← Back to Reports</button></div><div class="panel">'+(rows.join('')||'<div class="muted">No data in selected period</div>')+'</div>';

function quickLeftover1L(pid){
 const base=db.products.find(x=>String(x.id)===String(pid)&&x.formulaMaster),q=+document.getElementById('lfq_'+pid)?.value;
 if(!base||!Number.isInteger(q)||q<1)return alert('Enter bottle count');
 const bottle=db.raw.find(x=>String(x.name).toLowerCase()==='bottle 1l');
 if(!bottle||(+bottle.qty||0)<q)return alert('Not enough empty 1L bottles');
 let p=ensureFinishedProduct(base.name,1);

function packBatch(bid){
 let b=db.batches.find(x=>String(x.id)===String(bid)),
     p=db.products.find(x=>String(x.id)===String(document.getElementById('pkp'+bid).value)),
     q=+document.getElementById('pkq'+bid).value;
 if(!b||!p||q<=0)return;
 let size=+(p.size||1),liters=q*size,remain=b.remainingLiters??b.liters;
 if(liters>remain+0.0001)return alert('Quantity exceeds remaining liters: '+remain.toFixed(2)+' L');
 let packName=size===20?'Gallon 20L':size===10?'Gallon 10L':size===5?'Gallon 5L':size===4?'Gallon 4L':size===1?'Bottle 1L':'';
 let pack=packName?db.raw.find(r=>String(r.name).toLowerCase()===packName.toLowerCase()):null;
 let label=(size===4||size===5)?db.raw.find(r=>String(r.name).toLowerCase()==='label sticker'):null;
 if(pack && pack.qty<q)return alert('Not enough empty containers: '+packName+'\nRequired '+q+'\nAvailable '+pack.qty);

 p.qty+=q;b.remainingLiters=remain-liters;if(b.remainingLiters<0.0001){b.remainingLiters=0;b.status='closed'}
 let liquidUnitCost=b.liters?b.cost*(liters/b.liters)/q:0,unitCost=liquidUnitCost+(pack?pack.cost:0)+(label?label.cost:0);
 p.cost=unitCost;
 let mv={id:id(),batchId:b.id,date:today(),time:new Date().toISOString(),productId:p.id,name:p.name,qty:q,liters,balance:p.qty,unitCost};
 db.packings.unshift(mv);db.stockMoves.unshift({...mv,type:'production_pack'});
